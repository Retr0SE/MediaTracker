services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data/  
    environment:
      - POSTGRES_DB=my_media_tracker
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d my_media_tracker"]
      interval: 5s
      timeout: 5s
      retries: 5
    
  backend:
    build: ./backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
       - ./backend:/app
    ports:
       - "8000:8000"
    env_file:
       - .env
    depends_on:
      - db
  frontend:
    build: ./frontend
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on: 
      - backend 

volumes:
 postgres_data:
 frontend_node_modules:

